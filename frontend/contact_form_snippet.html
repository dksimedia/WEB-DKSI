<form id="contactForm" class="grid gap-6">
  <input type="hidden" name="honeypot" id="honeypot" style="display:none;">
  <div class="grid sm:grid-cols-2 gap-6">
    <div><label class="form-label">Nama Lengkap</label><input required name="name" placeholder="Budi Santoso" class="form-input"></div>
    <div><label class="form-label">Instansi / Perusahaan</label><input name="company" placeholder="PT/Kementerian/Universitas" class="form-input"></div>
  </div>
  <div><label class="form-label">Email</label><input type="email" required name="email" placeholder="name@email.com" class="form-input"></div>
  <div><label class="form-label">Nomor Telepon / WhatsApp</label><input type="tel" name="phone" placeholder="+62 811-xxxx-xxx" class="form-input"></div>
  <div><label class="form-label">Kategori Kebutuhan</label>
    <select name="category" class="form-input" style="background:var(--bg-soft);color:var(--text);">
      <option value="">Pilih kategori...</option>
      <option value="infrastructure">IT Infrastructure</option>
      <option value="education">Smart Education</option>
      <option value="ai">AI & IoT</option>
      <option value="procurement">Procurement / Rental</option>
      <option value="other">Lainnya</option>
    </select>
  </div>
  <div><label class="form-label">Pesan / Detail Kebutuhan</label><textarea name="message" rows="4" placeholder="Jelaskan kebutuhan ICT Anda secara detail..." class="form-input"></textarea></div>
  <div class="g-recaptcha" data-sitekey="YOUR_SITE_KEY_HERE"></div>
  <button type="submit" class="w-full bg-royal dark:bg-cyan text-white dark:text-darkBg py-5 rounded-2xl text-xs font-black uppercase tracking-widest hover:brightness-110 transition">Kirim Konsultasi</button>
  <p id="formMsg" class="hidden text-center text-emerald-500 font-bold text-sm mt-4">✓ Terkirim! Tim kami akan menghubungi dalam 1×24 jam.</p>
</form>
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
